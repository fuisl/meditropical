services:
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    build:
      context: LightRAG
      dockerfile: Dockerfile
      tags:
        - ghcr.io/hkuds/lightrag:latest
    ports:
      - "${PORT:-9621}:9621"
    volumes:
      - ./data/rag_storage:/app/data/rag_storage
      - ./data/inputs:/app/data/inputs
      - ./config.ini:/app/config.ini
      - ./.env:/app/.env
    env_file:
      - .env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: pgvector/pgvector:pg16
    env_file:
      - .env
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: meditropical
    volumes:
      - ./data/pg_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:6333/readyz || curl -fsS http://localhost:6333/readyz || wget -q -O- http://localhost:6333/healthz || curl -fsS http://localhost:6333/healthz || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 5s
