services:
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    build:
      context: LightRAG
      dockerfile: Dockerfile
      tags:
        - ghcr.io/hkuds/lightrag:latest
    ports:
      - "${PORT:-9621}:9621"
    volumes:
      - ./data/rag_storage:/app/data/rag_storage
      - ./data/inputs:/app/data/inputs
      - ./config.ini:/app/config.ini
      - ./.env:/app/.env
    env_file:
      - .env
    # restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_HOST: postgres
      QDRANT_URL: http://qdrant:6333
      LLM_BINDING_HOST: http://host.docker.internal:8002/v1
      EMBEDDING_BINDING_HOST: http://host.docker.internal:8002/v1
      REDIS_URI: redis://host.docker.internal:6379

    depends_on:
      - postgres
      - qdrant
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    env_file:
      - .env
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: meditropical
    volumes:
      - ./data/pg_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_data:/qdrant/storage

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis_data:/data
