[project]
name = "meditropical"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.0.3",
    "langgraph>=1.0.2",
    "langgraph-cli[inmem]>=0.4.4",
    "lightrag-hku[api,offline-storage, evaluation]",
    "mineru>=2.6.3",
    "langchain-openai>=1.0.0",
    "langgraph-api>=0.5.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ragas>=0.4.3",
    "datasets>=4.5.0",
    "langchain-ollama>=1.0.1",
]

[tool.uv.workspace]
members = [
    "LightRAG",
]

[tool.uv.sources]
lightrag-hku = { workspace = true }

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"


[dependency-groups]
dev = [
    "ipykernel>=7.0.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

executionEnvironments = [
  { root = ".", extraPaths = ["LightRAG", "LightRAG/src", "src", "benchmark"] }
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
