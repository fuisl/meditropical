[project]
name = "meditropical"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.0.2",
    "langgraph>=1.0.1",
    "langgraph-cli[inmem]>=0.4.4",
    "lightrag-hku[api]",
    "raganything>=1.2.8",
]

[tool.uv.workspace]
members = [
    "LightRAG",
]

[tool.uv.sources]
lightrag-hku = { workspace = true }

[dependency-groups]
dev = [
    "ipykernel>=7.0.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

executionEnvironments = [
  { root = ".", extraPaths = ["LightRAG", "LightRAG/src", "src"] }
]
